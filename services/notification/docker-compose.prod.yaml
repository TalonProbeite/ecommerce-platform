name: shop-notification-prod

services:
  notification-db:
    image: mongo:6
    container_name: notification-mongo-prod
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    volumes:
      - notification_mongo_data:/data/db
    networks:
      - notification_internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  notification-app:
    image: shop-notification-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-app-prod
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8080}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@notification-db:27017/
      MONGO_DB_NAME: ${MONGO_DB:-shop_notifications}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      notification-db:
        condition: service_healthy
    networks:
      - shop_global
      - notification_internal
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/api/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  notification-nginx:
    image: nginx:alpine
    container_name: notification-nginx-prod
    restart: always
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      notification-app:
        condition: service_healthy
    networks:
      - shop_global
      - notification_internal
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --no-check-certificate --tries=1 --spider https://localhost:443/api/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  ervices:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: notification-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  notification_mongo_data:

networks:
  notification_internal:
    driver: bridge
  shop_global:
    name: shop_global
