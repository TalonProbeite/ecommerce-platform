<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment successful</title>
</head>

<body style="margin:0; padding:0; background:#f4f4f5; font-family:Arial, sans-serif; color:#18181b;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
        <td align="center" style="padding:40px 20px;">

            <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
                   style="max-width:520px; background:#ffffff; border-radius:8px; padding:40px;">

                <tr>
                    <td>
                        <h1 style="margin:0 0 20px; font-size:24px;">
                            Payment successful
                        </h1>

                        <p style="margin:0 0 20px; font-size:16px; line-height:1.6;">
                            We've received your payment. Your order is now paid.
                        </p>

                        <div style="padding:16px; background:#f4f4f5; border-radius:6px;">
                            <p style="margin:0 0 12px; font-size:14px; color:#71717a;">
                                Order ID
                            </p>

                            <p style="margin:0 0 16px; font-size:16px; font-weight:bold;">
                                {{.OrderID}}
                            </p>

                            <p style="margin:0 0 6px; font-size:14px; color:#71717a;">
                                Amount paid
                            </p>

                            <p style="margin:0; font-size:20px; font-weight:bold;">
                                {{.Amount}}
                            </p>
                        </div>

                        <p style="margin:24px 0 0; font-size:14px; color:#71717a;">
                            Thank you for your payment.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
