<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f5; font-family:Arial, sans-serif; color:#18181b;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
            <td align="center" style="padding:40px 20px;">
                <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
                       style="max-width:520px; background:#ffffff; border-radius:8px; padding:40px;">
                    <tr>
                        <td>
                            <h1 style="margin:0 0 20px; font-size:24px;">
                                Welcome, {{.Name}}!
                            </h1>

                            <p style="margin:0 0 16px; font-size:16px; line-height:1.6;">
                                Your email has been verified and your account is ready to go.
                            </p>

                            <p style="margin:0 0 24px; font-size:16px; line-height:1.6;">
                                We're glad to have you with us. You can now browse the catalog,
                                make bookings, and manage your orders.
                            </p>

                            <table cellpadding="0" cellspacing="0" role="presentation">
                                <tr>
                                    <td style="border-radius:6px; background:#18181b;">
                                        <a href="{{.DashboardURL}}"
                                           style="display:inline-block; padding:12px 22px;
                                                  color:#ffffff; text-decoration:none;
                                                  font-size:15px;">
                                            Get started
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin:28px 0 0; font-size:13px; color:#71717a;">
                                Thanks for joining us!
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
