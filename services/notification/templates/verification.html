<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email</title>
</head>

<body style="margin:0; padding:0; background:#f4f4f5; font-family:Arial, sans-serif; color:#18181b;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
        <td align="center" style="padding:40px 20px;">

            <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
                   style="max-width:520px; background:#ffffff; border-radius:8px; padding:40px;">

                <tr>
                    <td>
                        <h1 style="margin:0 0 20px; font-size:24px;">
                            Verify your email
                        </h1>

                        <p style="margin:0 0 24px; font-size:16px; line-height:1.6;">
                            Enter the verification code below to confirm your email address.
                        </p>

                        <div style="margin:0 0 24px; padding:18px; background:#f4f4f5;
                                    border-radius:6px; text-align:center;
                                    font-size:32px; font-weight:bold;
                                    letter-spacing:8px;">
                            {{.Code}}
                        </div>

                        <p style="margin:0; font-size:13px; line-height:1.5; color:#71717a;">
                            This code will expire in {{.ExpiresIn}} minutes.
                            If you didn't create an account, you can safely ignore this email.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>
</body>
</html>
