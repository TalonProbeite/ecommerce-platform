# Catalog edge (inside the catalog stack).
#   /media/<bucket>/<key>  -> SeaweedFS S3 gateway, anonymous read only
#   everything else        -> catalog-app (Octane/RoadRunner on 8080)
#
# Upstreams are resolved per request, so this container starts even if a
# dependency is restarting.

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_port $fwd_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Product images are limited to 5 MB by the API; keep headroom.
    client_max_body_size 6m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /media/ {
        limit_except GET HEAD {
            deny all;
        }

        set $storage_upstream catalog-seaweedfs;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://$storage_upstream:8333;

        proxy_set_header Host $storage_upstream:8333;

        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        set $app_upstream catalog-app;
        proxy_pass http://$app_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $fwd_host;
        proxy_set_header X-Forwarded-Port  $fwd_port;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
    }
}