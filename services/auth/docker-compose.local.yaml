name: shop-auth-local

services:
  auth-db:
    image: postgres:18-alpine
    container_name: auth-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-shop_auth}
    volumes:
      - auth_pg_data:/var/lib/postgresql
    networks:
      - auth_internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-shop_auth}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - auth_redis_data:/data
    networks:
      - auth_internal
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - auth_rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - shop_global
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_PORT: ${APP_PORT:-8080}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}

      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@auth-db:5432/${DB_NAME:-shop_auth}?sslmode=disable

      REDIS_URL: redis://auth-redis:6379/${REDIS_DB:-0}

      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      EXCHANGE_NAME: ${EXCHANGE_NAME:-events_exchange}
      EXCHANGE_TYPE: ${EXCHANGE_TYPE:-direct}

      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}

      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URL: ${REDIRECT_URL:-https://localhost:8443/api/oauth/google/callback}

    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    ports:
      - "8080:8080"

    networks:
      - shop_global
      - auth_internal

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/api/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  auth-nginx:
    image: nginx:alpine
    container_name: auth-nginx
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      auth-app:
        condition: service_healthy
    networks:
      - shop_global
      - auth_internal
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1/api/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  auth_pg_data:
  auth_redis_data:
  auth_rabbitmq_data:

networks:
  shop_global:
    driver: bridge
  auth_internal:
    driver: bridge
