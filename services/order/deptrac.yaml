deptrac:
  paths:
    - ./app
  exclude_files:
    - '#.*Test\.php$#'
  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: '^App\\Domain\\'
    - name: Application
      collectors:
        - type: classLike
          value: '^App\\Application\\'
    - name: Infrastructure
      collectors:
        - type: classLike
          value: '^App\\Infrastructure\\'
    - name: Presentation
      collectors:
        - type: classLike
          value: '^App\\Http\\'
        - type: classLike
          value: '^App\\Console\\'
        - type: classLike
          value: '^App\\Providers\\'
  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    Presentation:
      - Domain
      - Application
      - Infrastructure
