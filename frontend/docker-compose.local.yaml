name: shop-frontend-mock

services:
  frontend:
    image: shop-frontend:mock
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: mock
        VITE_API_URL: https://localhost
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_MOCK_PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
