server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Resolve upstreams at request time so the gateway starts even when the
    # profile-gated catalog container is not running yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The public frontend catalog lives at /equipment now. These exact matches
    # keep old links away from the catalog service root (Laravel welcome page).
    location = /catalog  { return 301 /equipment$is_args$args; }
    location = /catalog/ { return 301 /equipment$is_args$args; }

    # Catalog admin API: the gateway turns the HttpOnly access cookie into a
    # Bearer header, because the SPA is not allowed to read auth cookies.
    location /catalog/api/v1/admin/ {
        # Product images are limited to 5 MB by the Catalog API. Keep headroom
        # here so uploads are not rejected by the gateway with 413 first.
        client_max_body_size 6m;

        set $catalog_upstream catalog-nginx;
        rewrite ^/catalog/(.*)$ /$1 break;
        proxy_pass https://$catalog_upstream:443;
        proxy_set_header Authorization $catalog_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /catalog;
        proxy_ssl_verify off;
    }

    location /catalog/ {
        set $catalog_upstream catalog-nginx;
        rewrite ^/catalog/(.*)$ /$1 break;
        proxy_pass https://$catalog_upstream:443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /catalog;
        proxy_ssl_verify off;
    }

    location /auth/ {
        proxy_pass https://auth-nginx:443/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_ssl_verify off;
    }

    location /notification/ {
        proxy_pass https://notification-nginx:443/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_ssl_verify off;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
